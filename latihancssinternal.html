<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>CSS Internal</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: brown;
            font-weight: 500;
        }
        .momo{
            font-style: italic;
            color: maroon; 
            font-family:'Courier New', Courier, monospace
        }
        .martin{
            font-size: xx-large;
            color:#5e8000;
            font-style:oblique;
            font-family:italic
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color: rgb(78, 4, 20);">Ini adalah kalimat pertama.</p>
    <p>Ini adalah kalimat kedua.</p>
    <p class="momo">Ini adalah kalimat ketiga.</p>
    <p class="martin">Ini adalah kalimat keempat.</p>
</body>
</html>
